name: Publish reviewed locale bundle

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Registered locale to package
        required: true
        type: choice
        options:
          - en

permissions:
  contents: write

concurrency:
  group: fakery-data-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: publication
    steps:
      - name: Require protected publication activation
        env:
          PUBLICATION_GATE: ${{ vars.FAKERY_DATA_PUBLICATION_ENABLED }}
        run: test "$PUBLICATION_GATE" = "reviewed-main-only"
      - name: Check out the dispatched main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate reviewed data
        run: |
          python3 scripts/bundle.py validate --root .
          python3 -m unittest discover -s tests -v
      - name: Build deterministic release assets
        env:
          LOCALE: ${{ inputs.locale }}
        run: python3 scripts/bundle.py package --root . --locale "$LOCALE" --output dist
      - name: Verify exact archive members and immutable names
        env:
          LOCALE: ${{ inputs.locale }}
        run: |
          VERSION=$(cat VERSION)
          ARCHIVE="dist/fakery-locale-${LOCALE}-${VERSION}.tar.gz"
          MANIFEST="dist/fakery-locale-${LOCALE}-${VERSION}-manifest.json"
          test -f "$ARCHIVE"
          test -f "$MANIFEST"
          python3 - "$ARCHIVE" <<'PY'
          import sys
          import tarfile
          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              names = archive.getnames()
          if names != ['manifest.json', 'fakery.jsonl']:
              raise SystemExit(f'unexpected archive members: {names!r}')
          PY
      - name: Refuse replacement and create the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALE: ${{ inputs.locale }}
        run: |
          VERSION=$(cat VERSION)
          export TAG="locale-${LOCALE}-v${VERSION}"
          bash scripts/refuse_existing_release.sh
          gh release create "$TAG" \
            "dist/fakery-locale-${LOCALE}-${VERSION}.tar.gz" \
            "dist/fakery-locale-${LOCALE}-${VERSION}-manifest.json" \
            --target "$GITHUB_SHA" \
            --title "Fakery locale ${LOCALE} ${VERSION}" \
            --notes "Reviewed immutable Fakery locale bundle ${LOCALE} ${VERSION}."
