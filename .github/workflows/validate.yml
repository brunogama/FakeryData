name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed data
        uses: actions/checkout@v4
      - name: Validate fixtures and evidence
        run: python3 scripts/bundle.py validate --root .
      - name: Test deterministic packaging
        run: python3 -m unittest discover -s tests -v
      - name: Check JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.').glob('**/*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          PY
